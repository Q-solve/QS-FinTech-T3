kind = "web"
previewPath = "/"
title = "Fraud Busters"
description = "A presentation-ready fraud intelligence command center for evaluating mobile-money transactions with transparent QSVM and classical-model evidence."
version = "1.0.0"
id = "artifacts/fraud-busters-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24433

[services.development]
run = "pnpm --filter @workspace/fraud-busters-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fraud-busters-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/fraud-busters-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24433"
BASE_PATH = "/"
